<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aachico Vault - Login Portal</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Master Theme & Responsive CSS -->
  <link rel="stylesheet" href="../css/themes.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center py-12 px-4 selection:bg-amber-500 selection:text-slate-950">

  <div class="max-w-md w-full glass-card p-8 rounded-3xl border border-slate-800 space-y-6 shadow-2xl bg-slate-900/90">
    
    <div class="text-center space-y-2">
      <a href="../index.html" class="inline-flex w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 items-center justify-center font-black text-2xl border border-amber-500/40 shadow-lg shadow-amber-500/10 mb-2">
        V
      </a>
      <h1 class="text-xl font-black text-white tracking-tight">फ्लीट एडमिन व मैनेजर लॉगिन</h1>
      <p class="text-xs text-slate-400">अपने Aachico Vault अकाउंट में प्रवेश करें।</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block text-slate-400 mb-1 font-medium">ईमेल आईडी</label>
        <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white font-mono focus:outline-none focus:border-amber-500" placeholder="name@company.com">
      </div>

      <div>
        <label class="block text-slate-400 mb-1 font-medium">पासवर्ड / पिन</label>
        <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white font-mono focus:outline-none focus:border-amber-500" placeholder="••••••••">
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/20 text-sm">
        सिक्योर लॉगिन करें
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-800 space-y-2 text-xs">
      <p class="text-slate-400">नया अकाउंट बनाना चाहते हैं?</p>
      <a href="signup.html" class="inline-block text-amber-400 hover:underline font-bold">
        फ्री रजिस्ट्रेशन करें
      </a>
    </div>

  </div>

  <footer class="mt-8 text-center text-xs text-slate-500">
    <p>सुरक्षित मल्टी-टेनेंट एन्क्रिप्टेड पोर्टल</p>
  </footer>

  <!-- Firebase & Auth Engine Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/config/firebase-init.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        // Firebase Authentication Sign-in
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Firestore से यूजर का रोल और कंपनी डेटा फेच करना
        const userDoc = await window.db.collection('users').doc(user.uid).get();
        
        let role = 'driver'; // डिफ़ॉल्ट रोल
        let companyId = 'default_company';

        if (userDoc.exists) {
          role = userDoc.data().role || 'driver';
          companyId = userDoc.data().companyId || 'default_company';
        }

        // AachicoAuth इंजन के जरिए सेशन और मल्टी-डिवाइस लॉक सेट करना और रीडायरेक्ट करना
        window.AachicoAuth.loginUser({
          uid: user.uid,
          email: user.email,
          role: role,
          companyId: companyId
        });

      } catch (error) {
        alert("लॉगिन असफल: " + error.message);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
