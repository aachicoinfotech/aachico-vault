<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aachico Vault - Company Signup & Registration</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Master Theme & Responsive CSS -->
  <link rel="stylesheet" href="../css/themes.css">

  <!-- Adsterra Monetization Scripts -->
  <script src="https://pl31151923.profitableratecpmnetwork.com/51/cd/c0/51cdc0777c0281a5bee5cd02bd67d97c.js"></script>
  <script src="https://pl31151922.profitableratecpmnetwork.com/19/dd/f9/19ddf9ecf7656b128bef1db758fc1ab2.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center py-12 px-4 selection:bg-amber-500 selection:text-slate-950">

  <div class="max-w-md w-full glass-card p-8 rounded-3xl border border-slate-800 space-y-6 shadow-2xl bg-slate-900/90">
    
    <div class="text-center space-y-2">
      <a href="../index.html" class="inline-flex w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 items-center justify-center font-black text-2xl border border-amber-500/40 shadow-lg shadow-amber-500/10 mb-2">
        V
      </a>
      <h1 class="text-xl font-black text-white tracking-tight">फ्री कंपनी रजिस्ट्रेशन</h1>
      <p class="text-xs text-slate-400">Aachico Vault फ्लीट मैनेजमेंट में आपका स्वागत है। अपना अकाउंट बनाएं।</p>
    </div>

    <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4 text-xs">
      <div>
        <label class="block text-slate-400 mb-1 font-medium">कंपनी या ट्रेवल्स का नाम (Company Name)</label>
        <input type="text" id="signup-company" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white focus:outline-none focus:border-amber-500" placeholder="ATR Travels Udaipur">
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-slate-400 mb-1 font-medium">ओनर का नाम</label>
          <input type="text" id="signup-owner" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white focus:outline-none focus:border-amber-500" placeholder="राजेश सिंह">
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-medium">मोबाइल नंबर</label>
          <input type="tel" id="signup-phone" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white font-mono focus:outline-none focus:border-amber-500" placeholder="9829000000">
        </div>
      </div>

      <div>
        <label class="block text-slate-400 mb-1 font-medium">ईमेल आईडी (Email)</label>
        <input type="email" id="signup-email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white focus:outline-none focus:border-amber-500" placeholder="name@company.com">
      </div>

      <div>
        <label class="block text-slate-400 mb-1 font-medium">लॉगिन पासवर्ड बनाएं (Password)</label>
        <input type="password" id="signup-password" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white font-mono focus:outline-none focus:border-amber-500" placeholder="••••••••">
      </div>

      <div>
        <label class="block text-slate-400 mb-1 font-medium">अकाउंट का प्रकार (Role)</label>
        <select id="signup-role" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white focus:outline-none focus:border-amber-500">
          <option value="admin">कंपनी एडमिन (Owner)</option>
          <option value="manager">मैनेजर डेस्क</option>
          <option value="driver">ड्राइवर</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/20 text-sm">
        अकाउंट बनाएं और शुरू करें (Free)
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-800 space-y-2 text-xs">
      <p class="text-slate-400">क्या आपका अकाउंट पहले से है?</p>
      <a href="login.html" class="inline-block text-amber-400 hover:underline font-bold">
        यहाँ लॉगिन करें
      </a>
    </div>

  </div>

  <footer class="mt-8 text-center text-xs text-slate-500">
    <p>कोई समस्या आने पर <a href="https://wa.me/919166381579?text=Hello,%20I%20need%20help%20with%20Aachico%20Vault%20signup." target="_blank" class="text-sky-400 hover:underline font-bold">WhatsApp पर संपर्क करें</a></p>
  </footer>

  <!-- Firebase & Auth Engine Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/config/firebase-init.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    async function handleSignup(event) {
      event.preventDefault();
      const companyName = document.getElementById('signup-company').value;
      const ownerName = document.getElementById('signup-owner').value;
      const phone = document.getElementById('signup-phone').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const role = document.getElementById('signup-role').value;

      try {
        // Firebase Auth में नया यूजर रजिस्टर करना
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        const companyId = 'comp_' + Math.random().toString(36).substring(2, 9);

        // Firestore डेटाबेस में यूजर का पूरा प्रोफाइल सेव करना
        await window.db.collection('users').doc(user.uid).set({
          email: email,
          companyName: companyName,
          ownerName: ownerName,
          phone: phone,
          companyId: companyId,
          role: role,
          createdAt: new Date().toISOString()
        });

        alert("बधाई हो! आपका फ्री अकाउंट सफलतापूर्वक बन गया है।");

        // AachicoAuth इंजन के जरिए लॉगिन कराकर सही रोल/डैशबोर्ड पर रीडायरेक्ट करना
        window.AachicoAuth.loginUser({
          uid: user.uid,
          email: email,
          role: role,
          companyId: companyId
        });

      } catch (error) {
        alert("साइनअप असफल: " + error.message);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
