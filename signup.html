<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aachico Vault - Company Signup & Registration</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Master Theme & Responsive CSS -->
  <link rel="stylesheet" href="./css/themes.css">

  <!-- Adsterra Monetization Scripts (Social Bar & Popunder) -->
  <script src="https://pl31151923.profitableratecpmnetwork.com/51/cd/c0/51cdc0777c0281a5bee5cd02bd67d97c.js"></script>
  <script src="https://pl31151922.profitableratecpmnetwork.com/19/dd/f9/19ddf9ecf7656b128bef1db758fc1ab2.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center py-12 px-4 selection:bg-amber-500 selection:text-slate-950">

  <!-- Signup Container -->
  <div class="max-w-md w-full glass-card p-8 rounded-3xl border border-slate-800 space-y-6 shadow-2xl bg-slate-900/90">
    
    <!-- Header -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 items-center justify-center font-black text-2xl border border-amber-500/40 shadow-lg shadow-amber-500/10 mb-2">
        V
      </a>
      <h1 class="text-xl font-black text-white tracking-tight">फ्री कंपनी रजिस्ट्रेशन</h1>
      <p class="text-xs text-slate-400">Aachico Vault फ्लीट मैनेजमेंट में आपका स्वागत है। अपना अकाउंट बनाएं।</p>
    </div>

    <!-- Signup Form -->
    <form id="signup-form" class="space-y-4 text-xs">
      <div>
        <label class="block text-slate-400 mb-1 font-medium">कंपनी या ट्रेवल्स का नाम (Company Name)</label>
        <input type="text" id="reg-company" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white focus:outline-none focus:border-amber-500" placeholder="ATR Travels Udaipur">
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-slate-400 mb-1 font-medium">ओनर का नाम</label>
          <input type="text" id="reg-owner" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white focus:outline-none focus:border-amber-500" placeholder="राजेश सिंह">
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-medium">मोबाइल नंबर</label>
          <input type="tel" id="reg-phone" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white font-mono focus:outline-none focus:border-amber-500" placeholder="9829000000">
        </div>
      </div>

      <div>
        <label class="block text-slate-400 mb-1 font-medium">लॉगिन पासवर्ड / पिन (Password)</label>
        <input type="password" id="reg-pass" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white font-mono focus:outline-none focus:border-amber-500" placeholder="••••••••">
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/20 text-sm">
        अकाउंट बनाएं और शुरू करें (Free)
      </button>
    </form>

    <!-- Footer Links -->
    <div class="text-center pt-2 border-t border-slate-800 space-y-2 text-xs">
      <p class="text-slate-400">क्या आपका अकाउंट पहले से है?</p>
      <a href="admin.html" class="inline-block text-amber-400 hover:underline font-bold">
        यहाँ लॉगिन करें
      </a>
    </div>

  </div>

  <!-- Footer Help -->
  <footer class="mt-8 text-center text-xs text-slate-500">
    <p>कोई समस्या आने पर <a href="https://wa.me/919166381579?text=Hello,%20I%20need%20help%20with%20Aachico%20Vault%20signup." target="_blank" class="text-sky-400 hover:underline font-bold">WhatsApp पर संपर्क करें</a></p>
  </footer>

  <script type="module">
    import { registerNewAdminAccount } from './js/modules/auth-admin.js';

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const companyName = document.getElementById('reg-company').value;
      const ownerName = document.getElementById('reg-owner').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-pass').value;

      // लोकल स्टोरेज में फ्री प्लान सेट कर दें
      localStorage.setItem('aachico_active_plan', 'Free Community');
      localStorage.setItem('aachico_company_name', companyName);
      localStorage.setItem('aachico_owner_name', ownerName);

      alert("बधाई हो! आपका फ्री अकाउंट सफलतापर्वक बन गया है। अब आपको एडमिन कंट्रोल रूम पर ले जाया जा रहा है।");
      window.location.href = "admin.html";
    });

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
