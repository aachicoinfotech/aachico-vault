<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aachico Vault - Driver Companion</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .glass-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950 pb-10">

  <!-- ================= OFFLINE STATUS BANNER ================= -->
  <div id="offlineBanner" class="hidden bg-amber-500 text-slate-950 text-center py-1.5 px-4 text-xs font-bold flex items-center justify-center space-x-1.5 sticky top-0 z-50 shadow-md">
    <i data-lucide="wifi-off" class="w-3.5 h-3.5"></i>
    <span>ऑफ़लाइन मोड - डेटा आपके फ़ोन में सुरक्षित है</span>
  </div>

  <!-- ================= DRIVER PIN LOGIN SCREEN ================= -->
  <div id="driverLoginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm p-6 rounded-3xl border border-emerald-500/30 space-y-6 shadow-2xl">
      <div class="text-center space-y-2">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-black text-2xl border border-emerald-500/40">
          <i data-lucide="steering-wheel" class="w-8 h-8"></i>
        </div>
        <h1 class="text-xl font-extrabold text-white">Driver Companion</h1>
        <p class="text-xs text-slate-400">अपनी कंपनी और 4-डिजिट पिन दर्ज करें</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Company Code</label>
          <input type="text" id="driverCompanyCode" placeholder="उदा. RJ27-FLEET" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white uppercase focus:outline-none focus:border-emerald-500 font-mono text-center" />
        </div>
        <div>
          <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Driver 4-Digit PIN</label>
          <input type="password" maxlength="4" id="driverPIN" placeholder="••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-2xl text-white focus:outline-none focus:border-emerald-500 font-mono text-center tracking-widest" />
        </div>
        <button onclick="handleDriverLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition flex items-center justify-center space-x-2 shadow-lg shadow-emerald-500/20">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>लॉगिन करें (Start Duty)</span>
        </button>
      </div>

      <div class="text-center">
        <a href="index.html" class="text-xs text-slate-500 hover:text-slate-400">← मुख्य वेबसाइट</a>
      </div>
    </div>
  </div>

  <!-- ================= DRIVER ACTIVE DASHBOARD ================= -->
  <div id="driverDashboard" class="hidden flex-1 flex flex-col">
    <!-- Driver Navbar -->
    <header class="glass-card border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm border border-emerald-500/30">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <div>
          <h2 id="displayDriverName" class="font-bold text-xs text-white">ड्राइवर डैशबोर्ड</h2>
          <p id="displayCompanyPill" class="text-[10px] text-amber-400 font-mono">RJ27-FLEET</p>
        </div>
      </div>
      <button onclick="logoutDriver()" class="text-xs bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center space-x-1">
        <i data-lucide="power" class="w-3 h-3 text-rose-400"></i>
        <span>ड्यूटी ऑफ</span>
      </button>
    </header>

    <!-- Main Duty Form -->
    <main class="flex-1 max-w-lg w-full mx-auto p-4 space-y-4">
      
      <!-- 4-Card Live Ledger Summary -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl">
          <span class="text-slate-400 text-[10px] block">पॉकेट एडवांस</span>
          <span id="ledgerAdvance" class="font-mono font-bold text-amber-400 text-base">₹0</span>
        </div>
        <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl">
          <span class="text-slate-400 text-[10px] block">कलेक्टेड कैश</span>
          <span id="ledgerCash" class="font-mono font-bold text-emerald-400 text-base">₹0</span>
        </div>
        <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl">
          <span class="text-slate-400 text-[10px] block">डीज़ल व टोल खर्चे</span>
          <span id="ledgerExpenses" class="font-mono font-bold text-rose-400 text-base">₹0</span>
        </div>
        <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl">
          <span class="text-slate-400 text-[10px] block">नेट बैलेंस (Due/Claim)</span>
          <span id="ledgerBalance" class="font-mono font-bold text-blue-400 text-base">₹0</span>
        </div>
      </div>

      <!-- TRIP FORM -->
      <div class="glass-card p-5 rounded-3xl border border-slate-800 space-y-4">
        <h3 class="font-bold text-sm text-white flex items-center space-x-2 border-b border-slate-800 pb-2">
          <i data-lucide="map-pin" class="w-4 h-4 text-emerald-400"></i>
          <span>ट्रिप एंट्री व मीटर ऑडिट (Trip Logger)</span>
        </h3>

        <!-- Car Selection -->
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">गाड़ी चुनें (Select Car Number)</label>
          <input type="text" id="tripCarNumber" placeholder="उदा. RJ-27-TA-1234" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white font-mono uppercase focus:border-emerald-500" />
        </div>

        <!-- 2-Phase Meter Reading -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">स्टार्ट KM (Start)</label>
            <input type="number" id="tripStartKm" placeholder="0" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white font-mono" />
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">एंड KM (End)</label>
            <input type="number" id="tripEndKm" placeholder="0" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white font-mono" />
          </div>
        </div>

        <!-- Compressed Camera Meter Photo Upload -->
        <div class="space-y-1.5">
          <label class="text-[11px] text-slate-400 block">ओडोमीटर फोटो (Anti-Tamper Live Photo)</label>
          <div class="flex items-center space-x-2">
            <label class="flex-1 cursor-pointer bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl p-3 text-center text-xs text-slate-300 flex items-center justify-center space-x-2 transition">
              <i data-lucide="camera" class="w-4 h-4 text-amber-400"></i>
              <span id="photoStatusText">कैमरा से फोटो खींचें</span>
              <input type="file" id="meterPhotoInput" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoCompression(event)" />
            </label>
          </div>
          <div id="photoPreviewContainer" class="hidden mt-2 relative">
            <img id="photoPreview" class="w-full h-36 object-cover rounded-xl border border-slate-700" />
            <span id="compressedSizeTag" class="absolute bottom-2 right-2 bg-slate-950/80 text-[10px] font-mono text-emerald-400 px-2 py-0.5 rounded">Compressed: 180 KB</span>
          </div>
        </div>

        <!-- Financial Entries -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">डीज़ल (लीटर)</label>
            <input type="number" id="tripDieselLitres" placeholder="0 L" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white font-mono" />
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">रास्ते का खर्च (₹)</label>
            <input type="number" id="tripExpenses" placeholder="₹0" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white font-mono" oninput="updateLedgerCalculations()" />
          </div>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 block mb-1">कस्टमर से प्राप्त कैश (₹)</label>
          <input type="number" id="tripCashCollected" placeholder="₹0" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-emerald-400 font-mono font-bold" oninput="updateLedgerCalculations()" />
        </div>

        <!-- Submit Button -->
        <button onclick="submitTripData()" id="submitBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition flex items-center justify-center space-x-2 shadow-lg shadow-emerald-500/20 mt-2">
          <i data-lucide="check-circle" class="w-4 h-4"></i>
          <span>ट्रिप सबमिट करें (Sync Trip)</span>
        </button>
      </div>

    </main>
  </div>

  <!-- ================= FIREBASE & OFFLINE ENGINE ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    // Your Exact Live Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDOIEKyvSwfpRybZBmNuImzdJ3hdlEO3hI",
      authDomain: "aachico-vault.firebaseapp.com",
      projectId: "aachico-vault",
      storageBucket: "aachico-vault.firebasestorage.app",
      messagingSenderId: "766953520082",
      appId: "1:766953520082:web:481f1aab82b74d78aae60b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeSession = null;
    let compressedPhotoBase64 = null;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      window.addEventListener('online', updateNetworkStatus);
      window.addEventListener('offline', updateNetworkStatus);
      updateNetworkStatus();

      const saved = localStorage.getItem('aachico_driver_session');
      if(saved) {
        activeSession = JSON.parse(saved);
        openDriverDashboard();
      }
    });

    function updateNetworkStatus() {
      const banner = document.getElementById('offlineBanner');
      if(!navigator.onLine) {
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    window.handleDriverLogin = function() {
      const code = document.getElementById('driverCompanyCode').value.trim().toUpperCase();
      const pin = document.getElementById('driverPIN').value.trim();

      if(!code || pin.length !== 4) {
        alert("कृपया सही कंपनी कोड और 4-अंकों का पिन डालें!");
        return;
      }

      activeSession = {
        companyCode: code,
        driverPin: pin,
        driverName: "ड्राइवर #" + pin
      };

      localStorage.setItem('aachico_driver_session', JSON.stringify(activeSession));
      openDriverDashboard();
    };

    function openDriverDashboard() {
      document.getElementById('driverLoginScreen').classList.add('hidden');
      document.getElementById('driverDashboard').classList.remove('hidden');
      document.getElementById('displayCompanyPill').innerText = activeSession.companyCode;
      document.getElementById('displayDriverName').innerText = activeSession.driverName;
      lucide.createIcons();
    }

    window.logoutDriver = function() {
      localStorage.removeItem('aachico_driver_session');
      location.reload();
    };

    // Client-Side Image Compression to WebP (150-200 KB)
    window.handlePhotoCompression = function(event) {
      const file = event.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          
          // Max dimension limit 1280px
          const maxDim = 1280;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Watermark with Date and Time
          const now = new Date().toLocaleString('en-IN');
          ctx.font = 'bold 24px sans-serif';
          ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
          ctx.fillText(`AACHICO AUDIT: ${now}`, 20, height - 30);

          // Compress to WebP at 0.7 quality
          compressedPhotoBase64 = canvas.toDataURL('image/webp', 0.7);
          
          // Show preview
          document.getElementById('photoPreview').src = compressedPhotoBase64;
          document.getElementById('photoPreviewContainer').classList.remove('hidden');
          document.getElementById('photoStatusText').innerText = "फोटो सेव हो गई (Compressed)";
          
          const approxKb = Math.round((compressedPhotoBase64.length * (3/4)) / 1024);
          document.getElementById('compressedSizeTag').innerText = `Compressed: ${approxKb} KB`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.updateLedgerCalculations = function() {
      const exp = parseFloat(document.getElementById('tripExpenses').value) || 0;
      const cash = parseFloat(document.getElementById('tripCashCollected').value) || 0;
      
      document.getElementById('ledgerCash').innerText = `₹${cash}`;
      document.getElementById('ledgerExpenses').innerText = `₹${exp}`;
      document.getElementById('ledgerBalance').innerText = `₹${cash - exp}`;
    };

    // Submit Trip Data to Firebase & Offline Fallback
    window.submitTripData = async function() {
      const car = document.getElementById('tripCarNumber').value.trim().toUpperCase();
      const startKm = parseFloat(document.getElementById('tripStartKm').value) || 0;
      const endKm = parseFloat(document.getElementById('tripEndKm').value) || 0;
      const diesel = parseFloat(document.getElementById('tripDieselLitres').value) || 0;
      const exp = parseFloat(document.getElementById('tripExpenses').value) || 0;
      const cash = parseFloat(document.getElementById('tripCashCollected').value) || 0;

      if(!car) {
        alert("कृपया गाड़ी नंबर दर्ज करें!");
        return;
      }

      const tripPayload = {
        carNumber: car,
        driverName: activeSession.driverName,
        driverPin: activeSession.driverPin,
        startKm: startKm,
        endKm: endKm,
        dieselLitres: diesel,
        expenses: exp,
        cashCollected: cash,
        meterPhotoUrl: compressedPhotoBase64 || null,
        status: "pending_audit",
        timestamp: new Date().toISOString()
      };

      const btn = document.getElementById('submitBtn');
      btn.innerText = "सिंक हो रहा है...";
      btn.disabled = true;

      try {
        if(navigator.onLine) {
          await addDoc(collection(db, "companies", activeSession.companyCode, "trips"), tripPayload);
          alert("ट्रिप सफलतापूर्वक सबमिट हो गई!");
        } else {
          // Offline storage
          let offlineTrips = JSON.parse(localStorage.getItem('aachico_offline_trips') || '[]');
          offlineTrips.push(tripPayload);
          localStorage.setItem('aachico_offline_trips', JSON.stringify(offlineTrips));
          alert("ऑफ़लाइन मोड: ट्रिप फ़ोन में सेव हो गई है, नेटवर्क आते ही कंपनी एडमिन को दिख जाएगी।");
        }

        // Reset inputs
        document.getElementById('tripStartKm').value = "";
        document.getElementById('tripEndKm').value = "";
        document.getElementById('tripDieselLitres').value = "";
        document.getElementById('tripExpenses').value = "";
        document.getElementById('tripCashCollected').value = "";
        document.getElementById('photoPreviewContainer').classList.add('hidden');
        document.getElementById('photoStatusText').innerText = "कैमरा से फोटो खींचें";
        compressedPhotoBase64 = null;

      } catch (err) {
        alert("एरर: " + err.message);
      } finally {
        btn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i><span>ट्रिप सबमिट करें (Sync Trip)</span>`;
        btn.disabled = false;
        lucide.createIcons();
      }
    };
  </script>
</body>
</html>
